services:
  mysql:
    image: mysql:8.0
    container_name: quantito-integration-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quantito-engine
      MYSQL_USER: quantito_user
      MYSQL_PASSWORD: quantito_password
    ports:
      - "3306:3306"
    volumes:
      - ../../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "quantito_user", "-pquantito_password"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 10s

  quantito:
    build:
      context: ../../../quantito
      dockerfile: Dockerfile
    container_name: quantito-integration-strategy
    restart: unless-stopped
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  quantito-engine:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: quantito-integration-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - QUANTITO_API_URL=http://quantito:8081
      - CONFIG_FILE=/app/config.toml
    volumes:
      - ./configs/config.toml:/app/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      quantito:
        condition: service_healthy
