# Web server configuration
[api]
listen = ":8080"

# Database connection configuration
[database]
host = "mysql:3306"
schema = "quantito-engine"
username = "quantito_user"
password = "quantito_password"
maxOpenConn = 10
maxIdleConn = 10
maxTTLConn = 180
maxIdleTimeConn = 60

# Logging configuration
[log]
level = "info"
logger = "console"
