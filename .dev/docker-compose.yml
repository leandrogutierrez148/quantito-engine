version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: quantito-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quantito-engine
      MYSQL_USER: quantito_user
      MYSQL_PASSWORD: quantito_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "quantito_user", "-pquantito_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  quantito-engine:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: quantito-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
